events {}

http {
  server_tokens off;

  # The gateway is reachable only from host loopback, where the trusted
  # Cloudflare tunnel supplies the original client address. Fall back to the
  # direct peer for local health checks and rehearsals.
  map $http_cf_connecting_ip $auth_rate_key {
    default $http_cf_connecting_ip;
    "" $binary_remote_addr;
  }
  map $http_cf_connecting_ip $auth_client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
  }
  limit_req_zone $auth_rate_key zone=auth_per_ip:10m rate=10r/s;

  server {
    listen 8080;
    client_max_body_size 1m;

    location = /health {
      proxy_pass http://auth:9999/health;
      proxy_set_header Host $host;
    }

    location /auth/v1/ {
      limit_req zone=auth_per_ip burst=30 nodelay;
      proxy_pass http://kong:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $auth_client_ip;
      proxy_set_header X-Forwarded-For $auth_client_ip;
    }

    location / {
      return 404;
    }
  }
}
