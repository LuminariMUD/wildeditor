services:
  # Wildeditor needs Supabase Auth and its PostgreSQL datastore, not the full
  # Supabase product surface. Keep upstream services available for explicit
  # platform maintenance while excluding them from the default Auth runtime.
  studio:
    profiles: [full-platform]

  rest:
    profiles: [full-platform]

  imgproxy:
    profiles: [full-platform]

  meta:
    profiles: [full-platform]

  # The public tunnel terminates TLS and reaches only this Auth-only gateway.
  # Studio, REST, Storage, PostgreSQL, and pooler administration stay private.
  kong:
    # Studio is outside the Auth runtime, so remove the upstream dashboard-only
    # startup dependency. Kong's Auth route remains health-checked below.
    depends_on: !reset {}
    ports: !reset []

  supavisor:
    profiles: [full-platform]
    ports: !reset []

  # Enable the pinned stack's generated ES256 signing/JWKS configuration
  # without modifying the vendored upstream Compose file during provisioning.
  auth:
    environment:
      GOTRUE_JWT_KEYS: ${JWT_KEYS:-[]}

  realtime:
    profiles: [full-platform]
    environment:
      API_JWT_JWKS: ${JWT_JWKS:-{"keys":[]}}

  storage:
    profiles: [full-platform]
    environment:
      JWT_JWKS: ${JWT_JWKS:-{"keys":[]}}

  functions:
    profiles: [full-platform]
    environment:
      SUPABASE_JWKS: ${JWT_JWKS:-{"keys":[]}}

  auth-gateway:
    container_name: wildeditor-auth-gateway
    image: nginx:1.31.3-alpine3.24
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      kong:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WILDEDITOR_AUTH_PORT:-8010}:8080"
    volumes:
      - ./volumes/proxy/wildeditor-auth.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
