version: '3.8'

services:
  wildeditor-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-8000}
      - FRONTEND_URL=${FRONTEND_URL}
      - MYSQL_DATABASE_URL=${MYSQL_DATABASE_URL}
      - WILDEDITOR_AUTH_ISSUERS=${WILDEDITOR_AUTH_ISSUERS}
      - WILDEDITOR_AUTH_JWKS_URLS=${WILDEDITOR_AUTH_JWKS_URLS:-}
      - WILDEDITOR_AUTH_AUDIENCE=${WILDEDITOR_AUTH_AUDIENCE:-authenticated}
      - WILDEDITOR_AUTH_ALLOWED_ALGORITHMS=${WILDEDITOR_AUTH_ALLOWED_ALGORITHMS:-ES256}
      - WILDEDITOR_BACKEND_SERVICE_KEY=${WILDEDITOR_BACKEND_SERVICE_KEY}
      - REQUIRE_AUTH=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - wildeditor

networks:
  wildeditor:
    driver: bridge
