name: Backend CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/backend/**'
      - 'packages/auth/**'
      - 'scripts/deploy-wildeditor-tunnel.sh'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/backend/**'
      - 'packages/auth/**'

env:
  PYTHON_VERSION: '3.14.6'
  DOCKER_IMAGE: 'wildeditor-backend'
  REGISTRY: 'ghcr.io'
  CLOUDFLARED_IMAGE: 'cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf'
  # Alternative: Use Docker Hub instead
  # REGISTRY: 'docker.io'
  # DOCKER_HUB_USERNAME: 'your-dockerhub-username'

jobs:
  # Test and lint the Python backend
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            apps/backend/src/requirements.txt
            packages/auth/requirements.txt
            
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==83.0.0 wheel==0.47.0
          python -m pip install -r apps/backend/src/requirements.txt
          python -m pip install --no-deps -e packages/auth
          python -m pip install flake8==7.3.0 mypy==2.3.0 bandit==1.9.4
          python -m pip check

      - name: Lint with flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 apps/backend/src --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. GitHub editor is 127 chars wide
          flake8 apps/backend/src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          
      - name: Type check with mypy
        run: |
          mypy apps/backend/src --ignore-missing-imports || true
          
      - name: Test with pytest
        run: |
          cd apps/backend
          
          # Set environment variables for testing
          export MYSQL_DATABASE_URL="mysql+pymysql://test:test@localhost:3306/test_db"
          export TESTING="1"
          
          # Run unit tests only (skip integration tests that require database)
          PYTHONPATH=. pytest tests/ -v -m "not integration" --tb=short
          
          # Run a basic smoke test to ensure the app can start
          python -c "
          import sys
          import os
          sys.path.insert(0, '.')
          os.environ['MYSQL_DATABASE_URL'] = 'mysql+pymysql://test:test@localhost:3306/test_db'
          os.environ['TESTING'] = '1'
          from src.main import app
          from fastapi.testclient import TestClient
          client = TestClient(app)
          response = client.get('/api/health')
          assert response.status_code == 200
          print('✅ Smoke test passed: API is responding')
          "
          
      - name: Security check with bandit
        run: |
          bandit -r apps/backend/src -f json -o bandit-report.json || true
          
      - name: Upload test results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: backend-test-results
          path: |
            bandit-report.json
          retention-days: 7

  # Build Docker image
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-backend
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
        
      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/luminarimud/wildeditor-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Output image digest
        run: echo ${{ steps.build.outputs.digest }}

  # Deploy to production server
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-backend, build-image]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.SELF_HOSTED_AUTH_PRODUCTION_ENABLED == 'true'))
    
    environment:
      name: production
      # URL will be determined by PRODUCTION_HOST:8000
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}
          
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          
      - name: Test SSH connection
        run: |
          echo "Testing SSH connection to ${{ secrets.PRODUCTION_HOST }}..."
          ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=yes ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} "echo 'SSH connection successful'"
          
      - name: Setup server environment
        run: |
          echo "Verifying server environment..."
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=30 ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'SETUP_EOF'
          
          # Check if Docker is installed
          if ! command -v docker &> /dev/null; then
            echo "❌ Docker is not installed on the server."
            echo "Please run the setup script first:"
            echo "  scp scripts/setup-server.sh user@server:/tmp/"
            echo "  ssh user@server 'chmod +x /tmp/setup-server.sh && /tmp/setup-server.sh'"
            exit 1
          fi
          
          # Check if user is in docker group
          if ! groups | grep -q docker; then
            echo "❌ User is not in docker group."
            echo "Please run: sudo usermod -aG docker $USER && exit && ssh back in"
            exit 1
          fi
          
          # Test Docker access without sudo
          if ! docker ps >/dev/null 2>&1; then
            echo "❌ Cannot access Docker without sudo."
            echo "Please ensure user is in docker group and log out/in to activate it."
            exit 1
          fi
          
          echo "✅ Server environment verified"
          echo "✅ Docker is installed and accessible"
          echo "✅ User has proper Docker permissions"
          
          # Check firewall configuration
          echo "🔥 Checking network configuration..."
          echo "Current network connections:"
          ss -tlnp | head -10 || netstat -tlnp | head -10 || echo "Cannot check network connections"
          
          echo "🌐 Checking if port 8000 is available..."
          if ss -tlnp | grep :8000; then
            echo "⚠️  Port 8000 is already in use:"
            ss -tlnp | grep :8000
          else
            echo "✅ Port 8000 is available"
          fi
          SETUP_EOF
          
      - name: Deploy to production server
        env:
          MYSQL_DATABASE_URL: ${{ secrets.MYSQL_DATABASE_URL }}
          WILDEDITOR_BACKEND_SERVICE_KEY: ${{ secrets.WILDEDITOR_BACKEND_SERVICE_KEY }}
          WILDEDITOR_MCP_KEY: ${{ secrets.WILDEDITOR_MCP_KEY }}
          WILDEDITOR_AUTH_ISSUERS: ${{ vars.WILDEDITOR_AUTH_ISSUERS }}
          DEPLOY_IMAGE: ${{ env.REGISTRY }}/luminarimud/wildeditor-backend@${{ needs.build-image.outputs.image_digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          WILDEDITOR_AUTH_ISSUERS="${WILDEDITOR_AUTH_ISSUERS:-https://auth.wildedit.luminarimud.com/auth/v1}"
          case ",$WILDEDITOR_AUTH_ISSUERS," in
            *,https://auth.wildedit.luminarimud.com/auth/v1,*) ;;
            *) echo "❌ Trusted issuers must include self-hosted production Auth"; exit 1 ;;
          esac

          # Check if database URL is provided
          if [ -z "$MYSQL_DATABASE_URL" ]; then
            echo "❌ MYSQL_DATABASE_URL secret is not set in GitHub repository"
            echo "Please add it in Settings → Secrets and variables → Actions"
            echo "Format: mysql+pymysql://username:password@hostname:port/database_name"
            exit 1
          fi
          
          # Check if the server-only MCP-to-backend key is provided.
          if [ -z "$WILDEDITOR_BACKEND_SERVICE_KEY" ] || [ -z "$WILDEDITOR_MCP_KEY" ]; then
            echo "❌ Backend service and MCP operation keys must both be set"
            exit 1
          fi
          
          echo "✅ Database URL is configured"
          echo "✅ Server-only backend service key is configured"
          
          # Create deployment script
          cat > deploy.sh << EOF
          #!/bin/bash
          set -e
          
          echo "🚀 Starting deployment..."
          
          # Configuration
          APP_DIR="/opt/wildeditor-backend"
          DOCKER_IMAGE="\${DEPLOY_IMAGE:-}"
          CONTAINER_NAME="wildeditor-backend"
          DATABASE_URL="\${MYSQL_DATABASE_URL:-}"
          BACKEND_SERVICE_KEY="\${WILDEDITOR_BACKEND_SERVICE_KEY:-}"
          MCP_KEY="\${WILDEDITOR_MCP_KEY:-}"
          AUTH_ISSUERS="\${WILDEDITOR_AUTH_ISSUERS:-}"
          
          # Validate database URL is not empty
          if [ -z "\$DATABASE_URL" ]; then
            echo "❌ Database URL not provided to deployment script"
            exit 1
          fi

          case "\$DOCKER_IMAGE" in
            ghcr.io/luminarimud/wildeditor-backend@sha256:*) ;;
            *) echo "❌ Refusing a non-immutable backend image"; exit 1 ;;
          esac

          # Validate the service boundary and exact issuer.
          if [ -z "\$BACKEND_SERVICE_KEY" ] || [ -z "\$MCP_KEY" ] || [ -z "\$AUTH_ISSUERS" ]; then
            echo "❌ Auth service-boundary configuration was not provided"
            exit 1
          fi
          
          echo "✅ Database URL and auth boundary configuration received"
          
          # Test MySQL connectivity from host before starting container
          echo "🔍 Testing MySQL connectivity from host..."
          if command -v mysql >/dev/null 2>&1; then
            # Extract connection details for testing
            DB_HOST=\$(echo "\$DATABASE_URL" | sed -n 's/.*@\([^:]*\):.*/\1/p')
            DB_PORT=\$(echo "\$DATABASE_URL" | sed -n 's/.*:\([0-9]*\)\/.*/\1/p')
            DB_USER=\$(echo "\$DATABASE_URL" | sed -n 's/.*\/\/\([^:]*\):.*/\1/p')
            
            if [ "\$DB_HOST" = "localhost" ] || [ "\$DB_HOST" = "127.0.0.1" ]; then
              echo "✅ MySQL host is localhost - should be accessible from host"
              # Test if MySQL is running
              if ss -tlnp | grep :3306 >/dev/null; then
                echo "✅ MySQL is listening on port 3306"
              else
                echo "❌ MySQL does not appear to be listening on port 3306"
                ss -tlnp | grep :330 || echo "No processes found listening on port 330*"
              fi
            else
              echo "🌐 MySQL host is: \$DB_HOST"
            fi
          else
            echo "ℹ️  MySQL client not installed on host - skipping host connectivity test"
          fi
          
          # Check if user is in docker group or has passwordless sudo
          if groups | grep -q docker; then
            DOCKER_CMD="docker"
            MKDIR_CMD="mkdir -p"
            echo "✅ User is in docker group, running without sudo"
          elif sudo -n true 2>/dev/null; then
            DOCKER_CMD="sudo docker"
            MKDIR_CMD="sudo mkdir -p"
            echo "✅ Passwordless sudo available"
          else
            echo "❌ Error: User needs to be in docker group or have passwordless sudo access"
            echo "Please run: sudo usermod -aG docker \\\$USER && newgrp docker"
            echo "Or configure passwordless sudo for docker commands"
            exit 1
          fi
          
          # Create app directory if it doesn't exist
          \$MKDIR_CMD \$APP_DIR
          cd \$APP_DIR
          
          # Login to GitHub Container Registry
          printf '%s' "\$GHCR_TOKEN" | \$DOCKER_CMD login ghcr.io -u "\$GHCR_ACTOR" --password-stdin
          
          # Pull the exact digest produced by this workflow run.
          echo "📦 Pulling immutable Docker image..."
          \$DOCKER_CMD pull \$DOCKER_IMAGE
          
          # Stop existing container
          echo "🛑 Stopping existing container..."
          \$DOCKER_CMD stop \$CONTAINER_NAME || true
          \$DOCKER_CMD rm \$CONTAINER_NAME || true
          
          # MariaDB listens on host loopback, so keep host networking while
          # overriding the image command to bind the API to loopback too.
          echo "🏃 Starting new container on the private loopback interface..."
          \$DOCKER_CMD run -d \\
            --name \$CONTAINER_NAME \\
            --restart unless-stopped \\
            --network host \\
            -e MYSQL_DATABASE_URL="\$DATABASE_URL" \\
            -e WILDEDITOR_BACKEND_SERVICE_KEY="\$BACKEND_SERVICE_KEY" \\
            -e WILDEDITOR_AUTH_ISSUERS="\$AUTH_ISSUERS" \\
            -e WILDEDITOR_AUTH_AUDIENCE="authenticated" \\
            -e WILDEDITOR_AUTH_ALLOWED_ALGORITHMS="ES256" \\
            -e WILDEDITOR_AUTH_JWKS_CACHE_TTL="300" \\
            -e MCP_URL="http://localhost:8001/mcp" \\
            -e MCP_API_KEY="\$MCP_KEY" \\
            -e REQUIRE_AUTH="true" \\
            -e WILDEDITOR_ENVIRONMENT="remote-production" \\
            -e ENVIRONMENT="production" \\
            -e PORT="8000" \\
            -e CORS_ORIGINS="https://wildedit.luminarimud.com" \\
            -e LOG_LEVEL="INFO" \\
            -v /var/log/wildeditor:/var/log/wildeditor \\
            \$DOCKER_IMAGE \\
            python -m uvicorn src.main:app --host 127.0.0.1 --port 8000
          
          # Wait for container to be healthy
          echo "🏥 Waiting for health check..."
          for i in {1..30}; do
            if \$DOCKER_CMD exec \$CONTAINER_NAME python -c "import requests; requests.get('http://localhost:8000/api/health', timeout=5).raise_for_status()" 2>/dev/null; then
              echo "✅ Container is healthy!"
              break
            fi
            if [ \$i -eq 30 ]; then
              echo "❌ Container failed to become healthy"
              echo "🔍 Container logs:"
              \$DOCKER_CMD logs --tail 20 \$CONTAINER_NAME
              echo "🔍 Testing database connectivity from container:"
              \$DOCKER_CMD exec \$CONTAINER_NAME python -c "
              import os
              import pymysql
              from urllib.parse import urlparse
              
              db_url = os.getenv('MYSQL_DATABASE_URL', '')
              if db_url:
                  parsed = urlparse(db_url.replace('mysql+pymysql://', 'mysql://'))
                  host = parsed.hostname
                  port = parsed.port or 3306
                  user = parsed.username
                  print(f'🔗 Attempting to connect to MySQL at {host}:{port} as user {user}')
                  try:
                      conn = pymysql.connect(host=host, port=port, user=user, password=parsed.password, database=parsed.path[1:])
                      print('✅ Database connection successful!')
                      conn.close()
                  except Exception as exc:
                      print(f'❌ Database connection failed: {type(exc).__name__}')
              else:
                  print('❌ No MYSQL_DATABASE_URL environment variable found')
              " || echo "Failed to test database connection"
              exit 1
            fi
            echo "Waiting... (\$i/30)"
            sleep 2
          done
          
          # Cleanup old images
          echo "🧹 Cleaning up old images..."
          \$DOCKER_CMD image prune -f
          
          echo "🎉 Deployment completed successfully!"
          EOF
          
          deployment_env=$(mktemp)
          trap 'rm -f "$deployment_env"' EXIT
          chmod 600 "$deployment_env"
          {
            printf 'export MYSQL_DATABASE_URL=%q\n' "$MYSQL_DATABASE_URL"
            printf 'export WILDEDITOR_BACKEND_SERVICE_KEY=%q\n' "$WILDEDITOR_BACKEND_SERVICE_KEY"
            printf 'export WILDEDITOR_MCP_KEY=%q\n' "$WILDEDITOR_MCP_KEY"
            printf 'export WILDEDITOR_AUTH_ISSUERS=%q\n' "$WILDEDITOR_AUTH_ISSUERS"
            printf 'export DEPLOY_IMAGE=%q\n' "$DEPLOY_IMAGE"
            printf 'export GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            printf 'export GHCR_ACTOR=%q\n' "$GHCR_ACTOR"
          } > "$deployment_env"

          # Copy and execute deployment inputs without placing credentials in
          # the SSH command or generated deployment script.
          echo "Copying deployment script to server..."
          scp -o StrictHostKeyChecking=yes -o ConnectTimeout=30 deploy.sh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/tmp/
          scp -o StrictHostKeyChecking=yes -o ConnectTimeout=30 "$deployment_env" ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/tmp/deploy-backend.env
          
          echo "Executing deployment script on server..."
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=30 ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} "
            chmod 600 /tmp/deploy-backend.env
            chmod +x /tmp/deploy.sh
            trap 'rm -f /tmp/deploy.sh /tmp/deploy-backend.env' EXIT
            source /tmp/deploy-backend.env
            /tmp/deploy.sh
          "

      - name: Ensure Cloudflare tunnel
        env:
          TUNNEL_CREDENTIALS_B64: ${{ secrets.CLOUDFLARE_TUNNEL_CREDENTIALS_B64 }}
          TUNNEL_ID: ${{ vars.CLOUDFLARE_TUNNEL_ID }}
        run: |
          test -n "$TUNNEL_CREDENTIALS_B64"
          test -n "$TUNNEL_ID"

          printf '%s' "$TUNNEL_CREDENTIALS_B64" | ssh \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} '
              set -e
              umask 077
              mkdir -p "$HOME/.cloudflared"
              chmod 700 "$HOME/.cloudflared"
              base64 -d > "$HOME/.cloudflared/wildeditor-api.json.new"
              chmod 600 "$HOME/.cloudflared/wildeditor-api.json.new"
              mv "$HOME/.cloudflared/wildeditor-api.json.new" "$HOME/.cloudflared/wildeditor-api.json"
            '

          printf '%s\n' \
            "tunnel: $TUNNEL_ID" \
            'credentials-file: /etc/cloudflared/credentials.json' \
            'ingress:' \
            '  - hostname: wildedit-api.luminarimud.com' \
            '    service: http://127.0.0.1:8000' \
            '  - hostname: wildedit-chat.luminarimud.com' \
            '    service: http://127.0.0.1:8002' \
            '  - hostname: auth.wildedit.luminarimud.com' \
            '    service: http://127.0.0.1:8010' \
            '  - service: http_status:404' \
            | ssh \
                -o StrictHostKeyChecking=yes \
                -o ConnectTimeout=30 \
                ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} '
                  set -e
                  umask 077
                  cat > "$HOME/.cloudflared/wildeditor-api.yml.new"
                  chmod 600 "$HOME/.cloudflared/wildeditor-api.yml.new"
                  mv "$HOME/.cloudflared/wildeditor-api.yml.new" "$HOME/.cloudflared/wildeditor-api.yml"
                '

          scp \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            scripts/deploy-wildeditor-tunnel.sh \
            ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/tmp/

          ssh \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} "
              set -e
              chmod +x /tmp/deploy-wildeditor-tunnel.sh
              trap 'rm -f /tmp/deploy-wildeditor-tunnel.sh' EXIT
              export CLOUDFLARED_IMAGE='${{ env.CLOUDFLARED_IMAGE }}'
              /tmp/deploy-wildeditor-tunnel.sh
            "

      - name: Verify deployment
        env:
          WILDEDITOR_BACKEND_SERVICE_KEY: ${{ secrets.WILDEDITOR_BACKEND_SERVICE_KEY }}
        run: |
          # Wait a moment for the service to be fully ready
          sleep 10
          
          echo "🔍 Verifying deployment..."
          
          # Primary verification: Test from within the server (this should always work)
          echo "Testing API health endpoint from server..."
          if printf '%s\n' "$WILDEDITOR_BACKEND_SERVICE_KEY" | ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=30 ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} '
            set -e
            IFS= read -r service_key
            test -n "$service_key"
            echo "🏥 Testing health endpoint from server:"
            if curl -fsS --connect-timeout 5 --max-time 10 http://localhost:8000/api/health; then
              echo
              echo "✅ Server-side health check PASSED"
              
              echo
              echo "🔐 Testing service authentication endpoint:"
              if curl -fsS --connect-timeout 5 --max-time 10 -H "Authorization: Bearer $service_key" http://localhost:8000/api/auth/status | grep -q "\"kind\":\"service\""; then
                echo "✅ Service authentication endpoint PASSED"
              else
                echo "❌ Service authentication endpoint failed"
                exit 1
              fi
              
              exit 0
            else
              echo
              echo "❌ Server-side health check FAILED"
              echo "Container logs:"
              docker logs --tail 10 wildeditor-backend || true
              exit 1
            fi
          '; then
            echo "✅ Server-side health check passed!"
          else
            echo "❌ Server-side health check failed!"
            exit 1
          fi
          
          # Public verification through the TLS-secured Cloudflare tunnel.
          echo ""
          echo "🌐 Testing public HTTPS connectivity..."
          if curl -fsS --connect-timeout 10 --max-time 30 \
            "https://wildedit-api.luminarimud.com/api/health" \
            | grep -q '"status":"healthy"'; then
            echo "✅ Public HTTPS API health check passed"
          else
            echo "❌ Public HTTPS API health check failed"
            exit 1
          fi

          if curl -fsS --connect-timeout 10 --max-time 30 \
            "https://wildedit-chat.luminarimud.com/health/ready" \
            | grep -q '"ready":true'; then
            echo "✅ Public HTTPS chat dependency readiness passed"
          else
            echo "❌ Public HTTPS chat dependency readiness failed"
            exit 1
          fi
          
          echo ""
          echo "✅ Deployment verification completed successfully!"
          echo "The application is running and responding to health checks on the server"
          
      - name: Create deployment notification
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const output = `#### 🚀 Backend Deployment Successful!\n
            - **Environment**: Production
            - **Version**: \`${{ github.sha }}\`
            - **API URL**: https://wildedit-api.luminarimud.com/api
            - **Health Check**: ✅ Passing
            - **Authentication**: 🔐 Human JWT required; private service principal for MCP
            - **Deployed by**: @${{ github.actor }}
            
            The backend is now live with role-authorized JWT authentication enabled.
            
            **For Administrators:**
            - Browsers send self-hosted Auth access tokens
            - Read and write operations require an authorized principal
            - Server credentials remain private to MCP/backend automation`;
            
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: '${{ github.sha }}',
              body: output
            })

  # Notify deployment status
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Log deployment result
        run: |
          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "🚀 Wildeditor Backend deployed successfully!"
          else
            echo "❌ Wildeditor Backend deployment failed!"
            exit 1
          fi
