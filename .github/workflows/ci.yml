name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '26.6.0'
  NPM_VERSION: '12.0.2'
  AUDIT_CI_VERSION: '7.1.0'
  NETLIFY_CLI_VERSION: '27.1.0'
  PROD_API_FALLBACK: 'https://wildedit-api.luminarimud.com/api'
  PROD_CHAT_URL: 'https://wildedit-chat.luminarimud.com'

jobs:
  # Combined job for efficiency
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Use repository npm version
        run: npm install --global "npm@${NPM_VERSION}"
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run linting
        run: npm run lint
        
      - name: Type check
        run: npm run type-check
        
      - name: Run tests
        run: npm test
        env:
          CI: true
          
      - name: Security audit
        run: |
          npm audit --audit-level=low
          npx --yes "audit-ci@${AUDIT_CI_VERSION}" --config audit-ci.json
          
      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: 'http://localhost:8000/api'
          # Supabase credentials are only available in production environment
          # The production deployment job will build with the actual credentials
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-dist
          path: apps/frontend/dist/
          retention-days: 7

  # Deploy preview for PRs
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Use repository npm version
        run: npm install --global "npm@${NPM_VERSION}"
          
      - name: Install dependencies
        run: npm ci
        
      - name: Clear build cache
        run: |
          echo "Clearing any cached build artifacts..."
          rm -rf apps/frontend/dist
          rm -rf apps/frontend/.vite
          rm -rf apps/frontend/node_modules/.vite
          npm cache clean --force
          
      - name: Override environment files
        run: |
          echo "Creating production .env file to override any local settings..."
          cat > apps/frontend/.env << EOF
          WILDEDITOR_ENVIRONMENT=remote-production
          VITE_API_URL=${{ secrets.PROD_API_URL || env.PROD_API_FALLBACK }}
          VITE_CHAT_API_URL=${{ env.PROD_CHAT_URL }}
          VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || '' }}
          VITE_DISABLE_AUTH=false
          EOF
          echo "Preview environment file created"
        
      - name: Build preview with correct API URL
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL || env.PROD_API_FALLBACK }}
          VITE_CHAT_API_URL: ${{ env.PROD_CHAT_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_DISABLE_AUTH: 'false'
          
      - name: Debug build environment
        run: |
          echo "Debugging environment variables during build..."
          echo "VITE_API_URL is set: ${{ secrets.PROD_API_URL != '' || env.PROD_API_FALLBACK != '' }}"
          echo "VITE_CHAT_API_URL is set: ${{ env.PROD_CHAT_URL != '' }}"
          echo "Checking if build files contain the expected API URL..."
          echo "Contents of dist directory:"
          ls -la apps/frontend/dist/ || echo "No dist directory found"
          echo "Contents of assets directory:"
          ls -la apps/frontend/dist/assets/ || echo "No assets directory found"
          echo "Searching for API URLs in all JS files:"
          find apps/frontend/dist -name "*.js" -exec grep -l "api\|localhost\|http" {} \; || echo "No JS files with API URLs found"
          
      - name: Verify preview build environment variables
        run: |
          test -n "$VITE_API_URL"
          test -n "$VITE_CHAT_API_URL"
          grep -RqsF "$VITE_API_URL" apps/frontend/dist/assets
          grep -RqsF "$VITE_CHAT_API_URL" apps/frontend/dist/assets
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL || env.PROD_API_FALLBACK }}
          VITE_CHAT_API_URL: ${{ env.PROD_CHAT_URL }}
          
      - name: Deploy preview
        run: |
          npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" deploy --no-build --dir=apps/frontend/dist --filter=@wildeditor/frontend --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="PR #${PR_NUMBER}: ${PR_TITLE}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PROD_SITE_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          
      - name: Comment PR
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const output = `#### Netlify Preview Deployment 🚀\n
            Preview URL will be available shortly.\n
            
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  # Production deployment
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment:
      name: production
      url: https://wildedit.luminarimud.com
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Use repository npm version
        run: npm install --global "npm@${NPM_VERSION}"
          
      - name: Install dependencies
        run: npm ci
        
      - name: Debug environment secrets
        run: |
          echo "Checking if environment secrets are accessible..."
          echo "SUPABASE_URL is set: ${{ secrets.SUPABASE_URL != '' }}"
          echo "SUPABASE_ANON_KEY is set: ${{ secrets.SUPABASE_ANON_KEY != '' }}"
          echo "Using production environment: ${{ github.event.deployment.environment || 'production' }}"
          echo "Note: These will be exposed as VITE_ prefixed variables during build"
          
      - name: Clean previous build artifacts
        run: |
          echo "Cleaning any previous build artifacts to ensure fresh production build..."
          rm -rf apps/frontend/dist
          rm -rf apps/frontend/.vite
          rm -rf apps/frontend/node_modules/.vite
          npm cache clean --force
          
      - name: Override environment files for production
        run: |
          echo "Creating production .env file to override any local settings..."
          cat > apps/frontend/.env << EOF
          WILDEDITOR_ENVIRONMENT=remote-production
          VITE_API_URL=${{ secrets.PROD_API_URL || env.PROD_API_FALLBACK }}
          VITE_CHAT_API_URL=${{ env.PROD_CHAT_URL }}
          VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || '' }}
          VITE_DISABLE_AUTH=false
          EOF
          echo "Production environment file created"
          
      - name: Verify source code before build
        run: |
          test -n "$VITE_API_URL"
          test -n "$VITE_CHAT_API_URL"
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          echo "Required production frontend configuration is present"
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL || env.PROD_API_FALLBACK }}
          VITE_CHAT_API_URL: ${{ env.PROD_CHAT_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_DISABLE_AUTH: 'false'
          
      - name: Build production
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL || env.PROD_API_FALLBACK }}
          VITE_CHAT_API_URL: ${{ env.PROD_CHAT_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_DISABLE_AUTH: 'false'
          
      - name: Verify build environment variables
        run: |
          echo "Checking if environment variables were properly embedded in build..."
          if grep -RqsF "$VITE_API_URL" apps/frontend/dist/assets; then
            echo "✅ Found configured API URL in build files"
          else
            echo "❌ Configured API URL not found in build files"
            exit 1
          fi

          if grep -RqsF "$VITE_CHAT_API_URL" apps/frontend/dist/assets; then
            echo "✅ Found configured chat URL in build files"
          else
            echo "❌ Configured chat URL not found in build files"
            exit 1
          fi
          
          if grep -RqsF "$VITE_SUPABASE_URL" apps/frontend/dist/assets; then
            echo "✅ Found Supabase URL in build files"
          else
            echo "❌ Supabase URL not found in build files - environment variables may not be set correctly"
            exit 1
          fi
          
          echo "Checking for masked values (asterisks)..."
          if grep -q "\*\*\*\*\*\*\*\*" apps/frontend/dist/assets/*.js 2>/dev/null; then
            echo "⚠️  WARNING: Found asterisk patterns in build files - possible masked secrets!"
            echo "This indicates environment variables may have been masked during build"
            exit 1
          else
            echo "✅ No masked values found in build files"
          fi
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL || env.PROD_API_FALLBACK }}
          VITE_CHAT_API_URL: ${{ env.PROD_CHAT_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          
      - name: Synchronize Netlify build environment
        run: |
          npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" env:set VITE_API_URL "$VITE_API_URL" --context production --force --filter=@wildeditor/frontend --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
          npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" env:set VITE_CHAT_API_URL "$VITE_CHAT_API_URL" --context production --force --filter=@wildeditor/frontend --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL || env.PROD_API_FALLBACK }}
          VITE_CHAT_API_URL: ${{ env.PROD_CHAT_URL }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PROD_SITE_ID }}

      - name: Deploy verified build to Netlify
        run: |
          echo "=== PRE-DEPLOYMENT FINAL CHECK ==="
          echo "Final verification of what's being deployed:"
          grep -Rqs "localhost:3001" apps/frontend/dist && echo "❌ FOUND localhost:3001 in build!" || echo "✅ No localhost:3001 found"
          grep -RqsF "$VITE_API_URL" apps/frontend/dist && echo "✅ Found configured API URL" || echo "❌ Configured API URL not found"
          echo ""
          npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" deploy --prod --no-build --dir=apps/frontend/dist --filter=@wildeditor/frontend --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="Production deploy from ${GITHUB_SHA}"
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL || env.PROD_API_FALLBACK }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PROD_SITE_ID }}

      - name: Verify live production bundle
        run: |
          index_file=$(mktemp)
          bundle_file=$(mktemp)
          for attempt in {1..12}; do
            curl --fail --silent --show-error --output "$index_file" "$PRODUCTION_URL/"
            asset_path=$(sed -n 's/.*src="\([^"]*\/assets\/index-[^"]*\.js\)".*/\1/p' "$index_file")
            if [ -n "$asset_path" ]; then
              curl --fail --silent --show-error --output "$bundle_file" "$PRODUCTION_URL$asset_path"
            fi
            if [ -n "$asset_path" ] && \
               grep -qF "$EXPECTED_API_URL" "$bundle_file" && \
               grep -qF "$EXPECTED_CHAT_URL" "$bundle_file" && \
               ! grep -qF "$RETIRED_API_URL" "$bundle_file"; then
              echo "Live production bundle contains the canonical API and chat endpoints"
              exit 0
            fi
            echo "Waiting for the verified bundle to become live (attempt $attempt/12)"
            sleep 5
          done
          echo "Live production bundle did not converge to the verified configuration"
          exit 1
        env:
          PRODUCTION_URL: https://wildedit.luminarimud.com
          EXPECTED_API_URL: ${{ env.PROD_API_FALLBACK }}
          EXPECTED_CHAT_URL: ${{ env.PROD_CHAT_URL }}
          RETIRED_API_URL: https://api.wildedit.luminarimud.com/api
          
  # Notify on deployment
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Notify Slack on Success
        if: needs.deploy-production.result == 'success'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🚀 Wildeditor deployed successfully to production!"
          
      - name: Notify Slack on Failure
        if: needs.deploy-production.result == 'failure'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ Wildeditor deployment to production failed!"
