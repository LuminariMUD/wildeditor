name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '26.6.0'
  NPM_VERSION: '12.0.2'
  PYTHON_VERSION: '3.14.6'
  NETLIFY_CLI_VERSION: '27.1.0'
  PROD_API_URL: 'https://wildedit-api.luminarimud.com/api'
  PROD_CHAT_URL: 'https://wildedit-chat.luminarimud.com'
  PROD_AUTH_URL: 'https://wildedit-auth.luminarimud.com'
  PROD_AUTH_CALLBACK_URL: 'https://wildedit.luminarimud.com/auth/callback'
  PROD_RECOVERY_URL: 'https://wildedit.luminarimud.com/reset-password'
  LUMINARI_SCHEMA_REF: 'cb8748a4adc862b7aef909c245b725bf4592ee48'

jobs:
  frontend-checks:
    name: Frontend lint, type check, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use repository npm version
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Install dependencies
        run: npm ci
      - name: Reject retired browser credentials in current source
        run: |
          if grep -RqsE --exclude-dir=dist --exclude-dir=node_modules \
            'VITE_WILDEDITOR_API_KEY|VITE_SUPABASE_ANON_KEY|https://[[:alnum:]-]+\.supabase\.co' \
            apps/frontend; then
            echo 'Retired managed Auth or browser credential reference found'
            exit 1
          fi
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Build with isolated CI Auth configuration
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8000/api
          VITE_CHAT_API_URL: http://127.0.0.1:8002
          VITE_SUPABASE_URL: http://127.0.0.1:8010
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_public
          VITE_AUTH_CALLBACK_URL: http://127.0.0.1:5173/auth/callback
          VITE_PASSWORD_RECOVERY_URL: http://127.0.0.1:5173/reset-password
          VITE_AUTH_SIGNUP_ENABLED: 'false'
          VITE_DISABLE_AUTH: 'false'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-dist
          path: apps/frontend/dist/
          retention-days: 7

  auth-boundary-tests:
    name: Auth, backend, MCP, and chat authorization tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.8-alpine3.22
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            packages/auth/requirements.txt
            apps/backend/src/requirements.txt
            apps/mcp/requirements.txt
            apps/agent/requirements.txt
      - name: Install Python service dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==83.0.0 wheel==0.47.0
          python -m pip install --no-deps -e packages/auth
          python -m pip install -r apps/backend/src/requirements.txt
          python -m pip install -r apps/mcp/requirements.txt
          python -m pip install -r apps/agent/requirements.txt
          python -m pip install flake8==7.3.0
          python -m pip check
      - name: Blocking Python source checks
        run: |
          flake8 packages/auth/src apps/backend/src apps/mcp/src apps/agent/src \
            --select=E9,F63,F7,F82 --show-source --statistics
      - name: Shared authentication suite
        run: PYTHONPATH=packages/auth/src python -m pytest -q packages/auth/tests
      - name: Backend authorization suite
        run: (cd apps/backend && PYTHONPATH=. python -m pytest tests/ -m "not integration" --tb=short)
      - name: MCP boundary suite
        run: (cd apps/mcp && PYTHONPATH=. python -m pytest tests/ --tb=short)
      - name: Chat ownership suite
        run: (cd apps/agent && PYTHONPATH=src python -m pytest tests/ --tb=short)
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/15

  self-hosted-config:
    name: Self-hosted Auth configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate operator scripts
        run: |
          for script in infrastructure/supabase/scripts/*.sh; do
            sh -n "$script"
          done
      - name: Validate pinned Compose boundary
        run: |
          docker compose \
            --env-file infrastructure/supabase/.env.example \
            -f infrastructure/supabase/docker-compose.yml \
            -f infrastructure/supabase/docker-compose.wildeditor.yml \
            config --quiet
          published=$(docker compose \
            --env-file infrastructure/supabase/.env.example \
            -f infrastructure/supabase/docker-compose.yml \
            -f infrastructure/supabase/docker-compose.wildeditor.yml \
            config --format json \
            | jq -r '.services | to_entries[] | select(.value.ports != null) | .key')
          test "$published" = auth-gateway

  mariadb-compatibility:
    name: LuminariMUD MariaDB compatibility
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: testroot
          MARIADB_DATABASE: luminari_test
          MARIADB_USER: wildeditor_test
          MARIADB_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check out pinned LuminariMUD schema authority
        uses: actions/checkout@v7.0.1
        with:
          repository: LuminariMUD/Luminari-Source
          ref: ${{ env.LUMINARI_SCHEMA_REF }}
          path: luminari-source
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            packages/auth/requirements.txt
            apps/backend/src/requirements.txt
      - name: Install LuminariMUD build, MariaDB, and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake build-essential libcurl4-openssl-dev libgd-dev \
            libjson-c-dev libmariadb-dev libssl-dev libtool mariadb-client \
            netcat-openbsd zlib1g-dev
          python -m pip install --upgrade pip==26.2.1 setuptools==83.0.0 wheel==0.47.0
          python -m pip install --no-deps -e packages/auth
          python -m pip install -r apps/backend/src/requirements.txt
          python -m pip check
      - name: Build pinned LuminariMUD runtime
        working-directory: luminari-source
        run: |
          cp src/campaign.example.h src/campaign.h
          cp src/mud_options.example.h src/mud_options.h
          cp src/vnums.example.h src/vnums.h
          autoreconf -fvi
          ./configure
          make -j"$(nproc)"
          test -x circle
      - name: Apply authoritative LuminariMUD schema
        env:
          MYSQL_PWD: testpass
        run: |
          mariadb --host=127.0.0.1 --user=wildeditor_test \
            luminari_test < luminari-source/sql/master_schema.sql
      - name: Prepare disposable LuminariMUD runtime
        working-directory: luminari-source
        run: |
          cp lib/mysql_config_example lib/mysql_config
          sed -i \
            -e 's/^mysql_host = .*/mysql_host = 127.0.0.1/' \
            -e 's/^mysql_database = .*/mysql_database = luminari_test/' \
            -e 's/^mysql_username = .*/mysql_username = wildeditor_test/' \
            -e 's/^mysql_password = .*/mysql_password = testpass/' \
            lib/mysql_config
          chmod 600 lib/mysql_config

          cp lib/etc/.gitkeep lib/etc/config
          mkdir -p lib/world/{zon,wld,mob,obj,shp,trg,qst,hlq}
          for type in zon wld mob obj shp trg qst hlq; do
            cp "lib/world/minimal/index.${type}" "lib/world/${type}/index"
          done
          cp lib/world/minimal/*.zon lib/world/zon/
          cp lib/world/minimal/*.wld lib/world/wld/
          cp lib/world/minimal/*.mob lib/world/mob/
          cp lib/world/minimal/*.obj lib/world/obj/

          mkdir -p lib/plrfiles/{A-E,F-J,K-O,P-T,U-Z,ZZZ}
          mkdir -p lib/plrobjs/{A-E,F-J,K-O,P-T,U-Z,ZZZ}
          mkdir -p lib/house lib/mudmail lib/text/help lib/misc log
          touch lib/text/{news,credits,motd,imotd,greetings,info,wizlist,immlist,policies,handbook,background}
          touch lib/text/help/{help,ihelp}
          printf '$\n' > lib/text/help/index
          printf '*\n' > lib/misc/messages
          printf '$\n' > lib/misc/socials.new
      - name: Boot LuminariMUD to initialize runtime-owned schema
        working-directory: luminari-source
        env:
          MYSQL_PWD: testpass
        run: |
          set -euo pipefail
          server_log=log/wildeditor-schema-init.log
          ./circle -o "$server_log" -q -s 4117 &
          server_pid=$!
          cleanup_server() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup_server EXIT

          ready=0
          for _ in {1..45}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            if nc -z 127.0.0.1 4117 2>/dev/null &&
              grep -q 'Entering game loop.' "$server_log"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            tail -n 160 "$server_log"
            exit 1
          fi

          path_types=$(mariadb --batch --skip-column-names \
            --host=127.0.0.1 --user=wildeditor_test luminari_test \
            --execute="SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'path_types'")
          triggers=$(mariadb --batch --skip-column-names \
            --host=127.0.0.1 --user=wildeditor_test luminari_test \
            --execute="SELECT COUNT(*) FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA = DATABASE() AND TRIGGER_NAME IN ('ad_maintain_path_index','ad_maintain_region_index','ai_maintain_path_index','ai_maintain_region_index','au_maintain_path_index','au_maintain_region_index','bi_digitalize_linestring','bu_digitalize_linestring')")
          test "$path_types" = 1
          test "$triggers" = 8
      - name: Exercise Wildeditor and spatial-trigger compatibility
        env:
          MYSQL_DATABASE_URL: mysql+pymysql://wildeditor_test:testpass@127.0.0.1:3306/luminari_test
          WILDEDITOR_ENVIRONMENT: remote-production
          WILDEDITOR_BACKEND_SERVICE_KEY: ci-mariadb-compatibility-service-key
          WILDEDITOR_AUTH_ISSUERS: http://auth.invalid/auth/v1
          WILDEDITOR_AUTH_AUDIENCE: authenticated
          WILDEDITOR_AUTH_ALLOWED_ALGORITHMS: ES256
          REQUIRE_AUTH: 'true'
          SEED_LUMINARI_BOOT_FIXTURES: 'true'
        run: PYTHONPATH=apps/backend python apps/backend/tests/mariadb_compatibility.py
      - name: Prove LuminariMUD loads Wildeditor fixtures
        working-directory: luminari-source
        env:
          MYSQL_PWD: testpass
        run: |
          set -euo pipefail
          for table in region_data path_data region_hints region_profiles; do
            rows=$(mariadb --batch --skip-column-names \
              --host=127.0.0.1 --user=wildeditor_test luminari_test \
              --execute="SELECT COUNT(*) FROM ${table}")
            test "$rows" = 1
          done

          server_log=log/wildeditor-fixture-load.log
          ./circle -o "$server_log" -q -s 4118 &
          server_pid=$!
          cleanup_server() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup_server EXIT

          ready=0
          for _ in {1..45}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            if nc -z 127.0.0.1 4118 2>/dev/null &&
              grep -q 'Info: Loaded 1 regions, top_of_region_table set to 0' "$server_log" &&
              grep -q 'Info: Loading wilderness roads and path definitions from MySQL database' "$server_log" &&
              grep -q 'Entering game loop.' "$server_log"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            tail -n 160 "$server_log"
            exit 1
          fi

  deploy-preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    needs: [frontend-checks, auth-boundary-tests, self-hosted-config, mariadb-compatibility]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global "npm@${NPM_VERSION}"
      - run: npm ci
      - name: Validate preview Auth configuration
        run: |
          test "$VITE_SUPABASE_URL" = "$PROD_AUTH_URL"
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) exit 1 ;; esac
        env:
          VITE_SUPABASE_URL: ${{ secrets.SELF_HOSTED_AUTH_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SELF_HOSTED_AUTH_PUBLISHABLE_KEY }}
      - name: Build preview
        run: npm run build
        env:
          VITE_API_URL: ${{ env.PROD_API_URL }}
          VITE_CHAT_API_URL: ${{ env.PROD_CHAT_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SELF_HOSTED_AUTH_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SELF_HOSTED_AUTH_PUBLISHABLE_KEY }}
          VITE_AUTH_CALLBACK_URL: ${{ env.PROD_AUTH_CALLBACK_URL }}
          VITE_PASSWORD_RECOVERY_URL: ${{ env.PROD_RECOVERY_URL }}
          VITE_AUTH_SIGNUP_ENABLED: 'false'
          VITE_DISABLE_AUTH: 'false'
      - name: Gate preview artifact
        run: |
          grep -RqsF "$PROD_API_URL" apps/frontend/dist/assets
          grep -RqsF "$PROD_CHAT_URL" apps/frontend/dist/assets
          grep -RqsF "$PROD_AUTH_URL" apps/frontend/dist/assets
          if grep -RqsE 'https://[[:alnum:]-]+\.supabase\.co' apps/frontend/dist \
            || grep -Rqs 'VITE_WILDEDITOR_API_KEY\|VITE_SUPABASE_ANON_KEY' apps/frontend/dist; then
            echo 'Retired managed Auth or browser credential found in preview artifact'
            exit 1
          fi
      - name: Deploy preview
        run: >-
          npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" deploy --no-build
          --dir=apps/frontend/dist --filter=@wildeditor/frontend
          --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
          --message="PR #${PR_NUMBER}: ${PR_TITLE}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PROD_SITE_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}

  deploy-production:
    name: Deploy frontend to production
    runs-on: ubuntu-latest
    needs: [frontend-checks, auth-boundary-tests, self-hosted-config, mariadb-compatibility]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.SELF_HOSTED_AUTH_PRODUCTION_ENABLED == 'true'))
    environment:
      name: production
      url: https://wildedit.luminarimud.com
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global "npm@${NPM_VERSION}"
      - run: npm ci
      - name: Validate production Auth configuration
        run: |
          test "$VITE_SUPABASE_URL" = "$PROD_AUTH_URL"
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) exit 1 ;; esac
        env:
          VITE_SUPABASE_URL: ${{ secrets.SELF_HOSTED_AUTH_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SELF_HOSTED_AUTH_PUBLISHABLE_KEY }}
      - name: Build production artifact
        run: npm run build
        env:
          VITE_API_URL: ${{ env.PROD_API_URL }}
          VITE_CHAT_API_URL: ${{ env.PROD_CHAT_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SELF_HOSTED_AUTH_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SELF_HOSTED_AUTH_PUBLISHABLE_KEY }}
          VITE_AUTH_CALLBACK_URL: ${{ env.PROD_AUTH_CALLBACK_URL }}
          VITE_PASSWORD_RECOVERY_URL: ${{ env.PROD_RECOVERY_URL }}
          VITE_AUTH_SIGNUP_ENABLED: 'false'
          VITE_DISABLE_AUTH: 'false'
      - name: Gate production artifact and server secrets
        run: |
          grep -RqsF "$PROD_API_URL" apps/frontend/dist/assets
          grep -RqsF "$PROD_CHAT_URL" apps/frontend/dist/assets
          grep -RqsF "$PROD_AUTH_URL" apps/frontend/dist/assets
          if grep -RqsE 'https://[[:alnum:]-]+\.supabase\.co' apps/frontend/dist \
            || grep -Rqs 'VITE_WILDEDITOR_API_KEY\|VITE_SUPABASE_ANON_KEY' apps/frontend/dist; then
            echo 'Retired managed Auth or browser credential found in production artifact'
            exit 1
          fi
          for server_secret in "$BACKEND_SERVICE_KEY" "$MCP_SERVICE_KEY"; do
            if [ -n "$server_secret" ] && grep -RqsF "$server_secret" apps/frontend/dist; then
              echo 'Server credential found in production artifact'
              exit 1
            fi
          done
        env:
          BACKEND_SERVICE_KEY: ${{ secrets.WILDEDITOR_BACKEND_SERVICE_KEY }}
          MCP_SERVICE_KEY: ${{ secrets.WILDEDITOR_MCP_KEY }}
      - name: Synchronize public Netlify environment
        run: |
          for assignment in \
            "VITE_API_URL=$PROD_API_URL" \
            "VITE_CHAT_API_URL=$PROD_CHAT_URL" \
            "VITE_SUPABASE_URL=$PROD_AUTH_URL" \
            "VITE_SUPABASE_PUBLISHABLE_KEY=$AUTH_PUBLISHABLE_KEY" \
            "VITE_AUTH_CALLBACK_URL=$PROD_AUTH_CALLBACK_URL" \
            "VITE_PASSWORD_RECOVERY_URL=$PROD_RECOVERY_URL" \
            'VITE_AUTH_SIGNUP_ENABLED=false' \
            'VITE_DISABLE_AUTH=false'; do
            name=${assignment%%=*}
            value=${assignment#*=}
            npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" env:set "$name" "$value" \
              --context production --force --filter=@wildeditor/frontend \
              --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
          done
        env:
          AUTH_PUBLISHABLE_KEY: ${{ secrets.SELF_HOSTED_AUTH_PUBLISHABLE_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PROD_SITE_ID }}
      - name: Deploy verified artifact
        run: >-
          npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" deploy --prod --no-build
          --dir=apps/frontend/dist --filter=@wildeditor/frontend
          --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
          --message="Production deploy from ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PROD_SITE_ID }}
      - name: Verify live production bundle
        run: |
          index_file=$(mktemp)
          bundle_file=$(mktemp)
          for attempt in {1..12}; do
            echo "Live bundle verification attempt $attempt/12"
            curl --fail --silent --show-error --output "$index_file" "$PRODUCTION_URL/"
            asset_path=$(sed -n 's/.*src="\([^"]*\/assets\/index-[^"]*\.js\)".*/\1/p' "$index_file")
            if [ -n "$asset_path" ]; then
              curl --fail --silent --show-error --output "$bundle_file" "$PRODUCTION_URL$asset_path"
            fi
            if [ -n "$asset_path" ] \
              && grep -qF "$PROD_API_URL" "$bundle_file" \
              && grep -qF "$PROD_CHAT_URL" "$bundle_file" \
              && grep -qF "$PROD_AUTH_URL" "$bundle_file" \
              && ! grep -qE 'https://[[:alnum:]-]+\.supabase\.co' "$bundle_file"; then
              echo 'Live bundle uses only the self-hosted Auth endpoint'
              exit 0
            fi
            sleep 5
          done
          echo 'Live production bundle did not converge'
          exit 1
        env:
          PRODUCTION_URL: https://wildedit.luminarimud.com

  notify:
    name: Notify deployment
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always() && github.ref == 'refs/heads/main'
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Wildeditor frontend deployment: ${{ needs.deploy-production.result }}"
