name: Deploy Chat Agent

on:
  push:
    branches:
      - main
    paths:
      - 'apps/agent/**'
      - 'packages/auth/**'
      - '.github/workflows/deploy-chat-agent.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.14.6'
  REGISTRY: ghcr.io
  IMAGE_NAME: wildeditor-chat-agent

jobs:
  # Build and push Docker image
  build:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/agent/requirements.txt

      - name: Test chat agent
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==83.0.0 wheel==0.47.0
          python -m pip install -r apps/agent/requirements.txt
          python -m pip install --no-deps -e packages/auth
          python -m pip check
          PYTHONPATH=apps/agent/src python -m pytest -q apps/agent/tests
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      
      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/luminarimud/wildeditor-chat-agent
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: apps/agent/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to production
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.SELF_HOSTED_AUTH_PRODUCTION_ENABLED == 'true'))
    
    environment:
      name: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}
      
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      
      - name: Deploy Chat Agent to Production
        env:
          # Map existing secrets to chat agent env vars
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          MCP_API_KEY: ${{ secrets.WILDEDITOR_MCP_KEY }}
          REDIS_PASSWORD: ${{ secrets.WILDEDITOR_REDIS_PASSWORD }}
          WILDEDITOR_AUTH_ISSUERS: ${{ vars.WILDEDITOR_AUTH_ISSUERS }}
          DEPLOY_IMAGE: ${{ env.REGISTRY }}/luminarimud/wildeditor-chat-agent@${{ needs.build.outputs.image_digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          WILDEDITOR_AUTH_ISSUERS="${WILDEDITOR_AUTH_ISSUERS:-https://auth.wildedit.luminarimud.com/auth/v1}"
          case ",$WILDEDITOR_AUTH_ISSUERS," in
            *,https://auth.wildedit.luminarimud.com/auth/v1,*) ;;
            *) echo "❌ Trusted issuers must include self-hosted production Auth"; exit 1 ;;
          esac

          OPENAI_MODEL="${OPENAI_MODEL:-gpt-5.6-sol}"
          case "$OPENAI_MODEL" in
            gpt-5.6-sol|gpt-5.6-terra|gpt-5.6-luna) ;;
            *)
              echo "❌ OPENAI_MODEL is not in the supported GPT-5.6 model allowlist"
              exit 1
              ;;
          esac

          if [ -z "$MCP_API_KEY" ] || [ "${#REDIS_PASSWORD}" -lt 32 ]; then
            echo "MCP_API_KEY and a 32+ character WILDEDITOR_REDIS_PASSWORD are required"
            exit 1
          fi
          case "$REDIS_PASSWORD" in
            *[!A-Za-z0-9_-]*)
              echo "WILDEDITOR_REDIS_PASSWORD must be URL-safe"
              exit 1
              ;;
          esac
          REDIS_URL="redis://default:${REDIS_PASSWORD}@localhost:6379/0"

          # Create deployment script (following MCP pattern)
          cat > deploy-agent.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "🚀 Starting Chat Agent deployment..."
          
          # Configuration
          DOCKER_IMAGE="${DEPLOY_IMAGE:-}"
          CONTAINER_NAME="wildeditor-chat-agent"
          REDIS_IMAGE="redis:8.2.8-alpine3.22"
          REDIS_CONTAINER_NAME="wildeditor-chat-redis"

          case "$DOCKER_IMAGE" in
            ghcr.io/luminarimud/wildeditor-chat-agent@sha256:*) ;;
            *) echo "❌ Refusing a non-immutable chat image"; exit 1 ;;
          esac
          
          # Check Docker access
          if groups | grep -q docker; then
            DOCKER_CMD="docker"
            echo "✅ User is in docker group"
          elif sudo -n true 2>/dev/null; then
            DOCKER_CMD="sudo docker"
            echo "✅ Passwordless sudo available"
          else
            echo "❌ Error: User needs to be in docker group or have passwordless sudo access"
            exit 1
          fi
          
          # Create agent directory
          echo "📁 Setting up agent directory..."
          mkdir -p ~/wildeditor-chat-agent
          cd ~/wildeditor-chat-agent
          echo "✅ Working directory: $(pwd)"
          
          # Login to GitHub Container Registry
          printf '%s' "$GHCR_TOKEN" | $DOCKER_CMD login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          
          # Pull pinned runtime images.
          echo "📦 Pulling Chat Agent and Redis Docker images..."
          $DOCKER_CMD pull $DOCKER_IMAGE
          $DOCKER_CMD pull $REDIS_IMAGE

          # Redis is production session storage. It is password protected,
          # persistent across container replacement, and bound only to host
          # loopback for the host-network chat service.
          $DOCKER_CMD stop "$REDIS_CONTAINER_NAME" >/dev/null 2>&1 || true
          $DOCKER_CMD rm "$REDIS_CONTAINER_NAME" >/dev/null 2>&1 || true
          if ss -ltn | grep -qE '127\\.0\\.0\\.1:6379[[:space:]]'; then
            echo "❌ Port 6379 is occupied by a service outside this deployment"
            exit 1
          fi
          $DOCKER_CMD run -d \
            --name "$REDIS_CONTAINER_NAME" \
            --restart unless-stopped \
            --network host \
            --volume wildeditor-chat-redis-data:/data \
            "$REDIS_IMAGE" \
            redis-server \
            --bind 127.0.0.1 \
            --protected-mode yes \
            --requirepass "$REDIS_PASSWORD" \
            --appendonly yes \
            --appendfsync everysec \
            --maxmemory 256mb \
            --maxmemory-policy allkeys-lru

          for i in {1..30}; do
            if $DOCKER_CMD exec -e REDISCLI_AUTH="$REDIS_PASSWORD" \
              "$REDIS_CONTAINER_NAME" redis-cli ping 2>/dev/null | grep -q PONG; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ Redis failed to become ready"
              $DOCKER_CMD logs --tail 20 "$REDIS_CONTAINER_NAME" || true
              exit 1
            fi
            sleep 1
          done
          
          # Stop existing container
          echo "🛑 Stopping existing container..."
          $DOCKER_CMD stop $CONTAINER_NAME || true
          $DOCKER_CMD rm $CONTAINER_NAME || true
          
          # Start new container with host networking (same as MCP and backend)
          echo "🏃 Starting new Chat Agent container..."

          export MODEL_PROVIDER="${AI_PROVIDER:-openai}"
          export MODEL_NAME="${OPENAI_MODEL:-gpt-5.6-sol}"
          export WILDERNESS_MCP_URL="http://localhost:8001"
          export WILDEDITOR_AUTH_AUDIENCE="authenticated"
          export WILDEDITOR_AUTH_ALLOWED_ALGORITHMS="ES256"
          export WILDEDITOR_AUTH_JWKS_CACHE_TTL="300"
          export REQUIRE_AUTH="true"
          export WILDEDITOR_ENVIRONMENT="remote-production"
          export STORAGE_BACKEND="redis"
          export FRONTEND_URL="https://wildedit.luminarimud.com"
          export CORS_ORIGINS='["https://wildedit.luminarimud.com"]'
          export HOST="127.0.0.1"
          export PORT="8002"
          export LOG_LEVEL="INFO"

          # Passing names without values makes Docker copy the already-exported
          # values without evaluating credentials as shell syntax.
          $DOCKER_CMD run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --network host \
            -e MODEL_PROVIDER \
            -e OPENAI_API_KEY \
            -e ANTHROPIC_API_KEY \
            -e DEEPSEEK_API_KEY \
            -e MODEL_NAME \
            -e ANTHROPIC_MODEL \
            -e DEEPSEEK_MODEL \
            -e MCP_API_KEY \
            -e WILDERNESS_MCP_URL \
            -e WILDEDITOR_AUTH_ISSUERS \
            -e WILDEDITOR_AUTH_AUDIENCE \
            -e WILDEDITOR_AUTH_ALLOWED_ALGORITHMS \
            -e WILDEDITOR_AUTH_JWKS_CACHE_TTL \
            -e REQUIRE_AUTH \
            -e WILDEDITOR_ENVIRONMENT \
            -e STORAGE_BACKEND \
            -e REDIS_URL \
            -e FRONTEND_URL \
            -e CORS_ORIGINS \
            -e HOST \
            -e PORT \
            -e LOG_LEVEL \
            -v "$HOME/logs/wildeditor-chat-agent:/var/log/chat-agent" \
            "$DOCKER_IMAGE" \
            python -m uvicorn src.main:app --host 127.0.0.1 --port 8002 --log-level info
          
          # Wait for container to be healthy
          echo "🏥 Waiting for health check..."
          for i in {1..30}; do
            if ! $DOCKER_CMD ps | grep -q $CONTAINER_NAME; then
              echo "❌ Container is not running"
              $DOCKER_CMD logs --tail 10 $CONTAINER_NAME
              exit 1
            fi
            
            readiness=$(curl -fsS --connect-timeout 5 --max-time 10 \
              http://localhost:8002/health/ready 2>/dev/null || true)
            if printf '%s' "$readiness" \
              | jq -e '.ready == true and .checks.storage == true and .checks.mcp == true' \
                >/dev/null; then
              echo "✅ Chat Agent and its dependencies are ready!"
              break
            fi
            
            if [ $i -eq 30 ]; then
              echo "❌ Container failed to become healthy after 60 seconds"
              echo "🔍 Container status:"
              $DOCKER_CMD ps -a | grep $CONTAINER_NAME || true
              echo "🔍 Full container logs:"
              $DOCKER_CMD logs $CONTAINER_NAME 2>&1 || true
              exit 1
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          
          # Test endpoints
          echo "🧪 Testing Chat Agent endpoints..."
          if curl -fsS --connect-timeout 5 --max-time 10 \
            http://localhost:8002/health/ready \
            | jq -e '.ready == true and .checks.storage == true and .checks.mcp == true' \
              >/dev/null; then
            echo "✅ Readiness chain is working"
          else
            echo "❌ Readiness chain failed"
            exit 1
          fi
          
          # Cleanup old images
          echo "🧹 Cleaning up old images..."
          $DOCKER_CMD image prune -f
          
          echo "🎉 Chat Agent deployment completed successfully!"
          EOF
          
          deployment_env=$(mktemp)
          trap 'rm -f "$deployment_env"' EXIT
          chmod 600 "$deployment_env"
          {
            printf 'export AI_PROVIDER=%q\n' "${AI_PROVIDER:-openai}"
            printf 'export OPENAI_API_KEY=%q\n' "$OPENAI_API_KEY"
            printf 'export ANTHROPIC_API_KEY=%q\n' "$ANTHROPIC_API_KEY"
            printf 'export DEEPSEEK_API_KEY=%q\n' "$DEEPSEEK_API_KEY"
            printf 'export OPENAI_MODEL=%q\n' "${OPENAI_MODEL:-gpt-5.6-sol}"
            printf 'export ANTHROPIC_MODEL=%q\n' "${ANTHROPIC_MODEL:-claude-fable-5}"
            printf 'export DEEPSEEK_MODEL=%q\n' "${DEEPSEEK_MODEL:-deepseek-chat}"
            printf 'export MCP_API_KEY=%q\n' "$MCP_API_KEY"
            printf 'export REDIS_PASSWORD=%q\n' "$REDIS_PASSWORD"
            printf 'export REDIS_URL=%q\n' "$REDIS_URL"
            printf 'export WILDEDITOR_AUTH_ISSUERS=%q\n' "$WILDEDITOR_AUTH_ISSUERS"
            printf 'export DEPLOY_IMAGE=%q\n' "$DEPLOY_IMAGE"
            printf 'export GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            printf 'export GHCR_ACTOR=%q\n' "$GHCR_ACTOR"
          } > "$deployment_env"

          # Copy deployment inputs without placing credentials in the SSH command.
          echo "📋 Copying deployment script to server..."
          scp -o StrictHostKeyChecking=yes deploy-agent.sh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/tmp/
          scp -o StrictHostKeyChecking=yes "$deployment_env" ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/tmp/deploy-agent.env
          
          # Execute deployment on server with environment variables
          echo "🚀 Executing deployment on server..."
          ssh -o StrictHostKeyChecking=yes ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} "
            chmod 600 /tmp/deploy-agent.env
            chmod +x /tmp/deploy-agent.sh
            trap 'rm -f /tmp/deploy-agent.sh /tmp/deploy-agent.env' EXIT
            source /tmp/deploy-agent.env
            /tmp/deploy-agent.sh
          "
      
      - name: Verify deployment
        env:
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          AUTH_TEST_EMAIL: ${{ secrets.AUTH_TEST_EMAIL }}
          AUTH_TEST_PASSWORD: ${{ secrets.AUTH_TEST_PASSWORD }}
          AUTH_PUBLISHABLE_KEY: ${{ secrets.SELF_HOSTED_AUTH_PUBLISHABLE_KEY }}
          AUTH_URL: https://auth.wildedit.luminarimud.com
        run: |
          sleep 10
          echo "🔍 Verifying Chat Agent deployment..."
          OPENAI_MODEL="${OPENAI_MODEL:-gpt-5.6-sol}"
          
          # Test from server
          ssh -o StrictHostKeyChecking=yes ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} "
            echo '🏥 Testing Chat Agent dependency readiness from server:'
            if curl -fsS --connect-timeout 5 --max-time 10 http://localhost:8002/health/ready \
              | jq -e '.ready == true and .checks.storage == true and .checks.mcp == true'; then
              echo ''
              echo '✅ Chat Agent dependency readiness PASSED'
              exit 0
            else
              echo ''
              echo '❌ Chat Agent health check FAILED'
              echo 'Container logs:'
              docker logs --tail 10 wildeditor-chat-agent || true
              exit 1
            fi
          "

          test -n "$AUTH_TEST_EMAIL"
          test -n "$AUTH_TEST_PASSWORD"
          test -n "$AUTH_PUBLISHABLE_KEY"

          token_file=$(mktemp)
          trap 'rm -f "$token_file"' EXIT
          login_body=$(jq -nc \
            --arg email "$AUTH_TEST_EMAIL" \
            --arg password "$AUTH_TEST_PASSWORD" \
            '{email:$email,password:$password}')
          curl -fsS --connect-timeout 10 --max-time 30 \
            -H "apikey: $AUTH_PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' \
            -d "$login_body" \
            "$AUTH_URL/auth/v1/token?grant_type=password" > "$token_file"
          access_token=$(jq -er '.access_token' "$token_file")

          echo "🌐 Testing authenticated Chat Agent model and inference..."
          service_model=$(curl -fsS --connect-timeout 10 --max-time 30 \
            https://wildedit-chat.luminarimud.com/ \
            | jq -er '.model')
          test "$service_model" = "openai/$OPENAI_MODEL"

          inference_ok=false
          for attempt in 1 2 3; do
            echo "Inference probe attempt $attempt/3"
            session_id=$(curl -fsS --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $access_token" \
              -H 'Content-Type: application/json' \
              -d '{}' \
              https://wildedit-chat.luminarimud.com/api/session/ \
              | jq -er '.session_id') || session_id=""

            if [ -n "$session_id" ]; then
              request_body=$(jq -nc \
                --arg message 'Reply with the marker CHAT_DEPLOYMENT_OK. Do not call tools.' \
                --arg session_id "$session_id" \
                '{message:$message,session_id:$session_id}')
              assistant_message=$(curl -fsS --connect-timeout 10 --max-time 120 \
                -H "Authorization: Bearer $access_token" \
                -H 'Content-Type: application/json' \
                -d "$request_body" \
                https://wildedit-chat.luminarimud.com/api/chat/message \
                | jq -er '.response.message') || assistant_message=""

              if [[ "$assistant_message" == *CHAT_DEPLOYMENT_OK* \
                && "$assistant_message" != "I encountered an error:"* ]]; then
                inference_ok=true
                break
              fi
            fi

            sleep 3
          done

          if [ "$inference_ok" != true ]; then
            echo "❌ Public Chat Agent inference probe failed"
            exit 1
          fi

          curl -fsS --connect-timeout 10 --max-time 30 \
            -X POST \
            -H "apikey: $AUTH_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $access_token" \
            "$AUTH_URL/auth/v1/logout" >/dev/null
          
          echo "✅ Chat Agent deployment verified successfully!"
